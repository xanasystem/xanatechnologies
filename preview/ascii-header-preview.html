<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xana — Preview animación ASCII (save.design)</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#05050f; }
  body{ display:grid; place-items:center; padding:24px;
    font-family:'Mona Sans',system-ui,-apple-system,'Segoe UI',sans-serif; }
  #xaWrap{
    --bg:#05050f; --dim:#a6a9c0;
    position:relative; width:100%; max-width:1100px; height:min(78vh,620px);
    border-radius:18px; overflow:hidden; background:var(--bg); isolation:isolate;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.8);
  }
  #xaWrap[data-t="flujo"]{ --bg:#04060e; }
  .xa-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; }
  .xa-veil{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(120% 90% at 30% 62%, color-mix(in srgb, var(--bg) 88%, transparent) 0%, transparent 55%),
      linear-gradient(180deg, color-mix(in srgb, var(--bg) 70%, transparent) 0%, transparent 22%, transparent 70%, var(--bg) 100%);
  }
  .xa-ui{ position:absolute; top:16px; right:16px; z-index:3; }
  .xa-toggle{ display:flex; gap:4px; padding:4px; border-radius:999px;
    background:color-mix(in srgb,#fff 6%,transparent); border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(8px); }
  .xa-toggle button{ font:600 12px/1 'Mona Sans',system-ui,sans-serif; letter-spacing:.04em;
    color:var(--dim); background:transparent; border:0; cursor:pointer; padding:8px 15px; border-radius:999px; transition:.2s; }
  .xa-toggle button.is-active{ color:#fff; background:color-mix(in srgb,#fff 12%,transparent); }
  .xa-content{ position:absolute; z-index:2; left:0; bottom:0; padding:clamp(22px,4vw,52px); max-width:min(700px,92%); }
  .xa-eyebrow{ margin:0 0 14px; font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace;
    font-size:12px; letter-spacing:.28em; color:color-mix(in srgb,var(--dim) 90%,#fff); text-transform:uppercase; }
  .xa-title{ margin:0; color:#edeef6; font-weight:800; letter-spacing:-.035em; line-height:1.0;
    font-size:clamp(2rem,1.1rem+3.4vw,3.6rem); }
  .xa-accent{ background:linear-gradient(120deg,#fff 8%,var(--a1) 55%,var(--a2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  #xaWrap{ --a1:#c77bf0; --a2:#6ea8ff; }
  #xaWrap[data-t="flujo"]{ --a1:#7fe3ff; --a2:#9d7bff; }
  .xa-support{ margin:16px 0 0; max-width:48ch; color:var(--dim); line-height:1.5; font-size:clamp(.9rem,.82rem+.3vw,1.05rem); }
  .hint{ margin-top:16px; color:#6c6f88; font-size:13px; text-align:center; }
</style>
</head>
<body>
  <div>
    <div id="xaWrap" data-t="horizonte">
      <canvas class="xa-canvas" id="xaCanvas" aria-hidden="true"></canvas>
      <div class="xa-veil" aria-hidden="true"></div>
      <div class="xa-ui">
        <div class="xa-toggle" role="group" aria-label="Theme">
          <button data-theme="horizonte" class="is-active">Horizonte</button>
          <button data-theme="flujo">Flujo</button>
        </div>
      </div>
      <div class="xa-content">
        <p class="xa-eyebrow">/// XANA TECHNOLOGIES</p>
        <h1 class="xa-title">Two brands.<br><span class="xa-accent">One technology company.</span></h1>
        <p class="xa-support">Xana&nbsp;System · Woman&nbsp;on&nbsp;Mars — product tech &amp; digital strategy under one roof.</p>
      </div>
    </div>
    <p class="hint">Preview de la animación del header · inspirada en save.design · toggle de tema arriba a la derecha</p>
  </div>

<script>
(function(){
  const wrap = document.getElementById('xaWrap');
  const canvas = document.getElementById('xaCanvas');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CHARS = ['.','.','.','·','·',':',':','+','-','*','/','×','|','—'];
  const PALETTES = {
    horizonte:{ base:'166,169,192', accents:['117,35,237','31,99,200','199,123,240'] },
    flujo:    { base:'166,169,192', accents:['42,212,255','74,131,241','112,79,243'] }
  };
  let theme='horizonte', cells=[], cols=0, rows=0, cw=15, ch=21, dpr=1, t0=0, raf=null;

  function build(){
    const r = wrap.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = Math.round(r.width*dpr);
    canvas.height = Math.round(r.height*dpr);
    cols = Math.ceil(r.width/cw)+1;
    rows = Math.ceil(r.height/ch)+1;
    const pal = PALETTES[theme];
    cells = [];
    let s = 1337;
    const rnd = ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      const accent = rnd()<0.14;
      const col = accent ? pal.accents[(rnd()*pal.accents.length)|0] : pal.base;
      cells.push({ x:x*cw+3, y:y*ch+ch-6, chr:CHARS[(rnd()*CHARS.length)|0],
        speed:0.4+rnd()*1.3, phase:rnd()*Math.PI*2,
        peak: accent?0.55+rnd()*0.4:0.28+rnd()*0.5, col });
    }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.font='13px ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace';
    ctx.textBaseline='alphabetic';
  }
  function frame(now){
    if(!t0) t0=now;
    const t=(now-t0)/1000;
    const r = wrap.getBoundingClientRect();
    ctx.clearRect(0,0,r.width,r.height);
    for(let i=0;i<cells.length;i++){
      const c=cells[i];
      const o=0.06+(c.peak-0.06)*(0.5-0.5*Math.cos(t*c.speed+c.phase));
      ctx.fillStyle='rgba('+c.col+','+o.toFixed(3)+')';
      ctx.fillText(c.chr,c.x,c.y);
    }
    raf=requestAnimationFrame(frame);
  }
  function still(){
    const r = wrap.getBoundingClientRect();
    ctx.clearRect(0,0,r.width,r.height);
    for(const c of cells){ ctx.fillStyle='rgba('+c.col+','+(c.peak*0.6).toFixed(3)+')'; ctx.fillText(c.chr,c.x,c.y); }
  }
  function start(){ build(); if(reduce){ still(); } else { if(raf)cancelAnimationFrame(raf); t0=0; raf=requestAnimationFrame(frame);} }
  wrap.querySelectorAll('.xa-toggle button').forEach(b=>{
    b.addEventListener('click',()=>{ theme=b.dataset.theme; wrap.setAttribute('data-t',theme);
      wrap.querySelectorAll('.xa-toggle button').forEach(x=>x.classList.toggle('is-active',x===b)); build(); });
  });
  if(window.ResizeObserver){ new ResizeObserver(()=>build()).observe(wrap); }
  start();
})();
</script>
</body>
</html>
